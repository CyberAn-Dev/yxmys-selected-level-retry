name: Verify and build Windows
on:
  workflow_dispatch:
  push:
    branches: [main, feature/selected-level-retry]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-build.lock
      - name: Regression tests, packaging and isolated smoke test
        shell: pwsh
        run: ./build.ps1 -Python (Get-Command python).Source
      - uses: actions/upload-artifact@v4
        with:
          name: yxmys-selected-level-retry-windows
          path: |
            release/*.exe
            release/release-info.json
